<!DOCTYPE html>
<html>
    <head>
    <tittle>Responsive Design</tittle>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin:0;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', ;
            background-color:rgb(43, 110, 152);

        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;

        }
        .logo{
            margin:0;

        }
        .nav-links{
            display:flex;
            gap:25px
        }
        .nav-links a{
            text-decoration: none;
        }
        .menu{
            display: none;
        }
        @media(max-width:600px){
            .nav-links{
                display: none;
            }
            .menu{
                display: block;
                font-size: 25px;
            }
        }
        .content{
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            text-align: center;
        }
        @media(min-width:601px) and
        (max-width:900px) {
            .content{
                width: 85%; 
            }
        }
        .cards{
            width: 90%;
            max-width: 1000px;
            margin:40px auto;
            display:flex;
            gap:20px;
            flex-direction: column;
        }
        .card{
            flex:1;
            padding:20px;
            border:1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            width: 100%;

        }
        .card button{
            padding: 10px 20px;
            border:none;
            border-radius: 5px;
            cursor:pointer;
        }
        @media(max-width:600px){
            .card button{
                width:100%;
            }
        }
        h1{
            font-size: 40px;
        }
        @media(max-width:600px){
            h1{
                font-size: 28px;
            }
        }
        h1{
            font-size: clamp(28px,5vw,50px);
        }
        img {
            
            height: 200px;
            display: block;
            margin:auto ;
            border-radius: 100%;
            width: 200px;
            object-fit: cover;
        }
        .content{
            width:90%;
            max-width: 800px;
            margin: auto;

        }
        @media(max-width:600px){
            body{
                font-size: 16px;
            }
            .container{
                width: 95%;
            }
            
        }




    </style>
    </head>
    <body>
        <nav class="navbar">
            <h2 class="logo">My Portfolio</h2>
            <div class="nav-links">
                <a href="responsivedesign.html">Home</a>
                <a href="responsivedesign.html">About</a>
                <a href="responsivedesign.html">Projects</a>
                <a href="responsivedesign.html">Contacts</a>
            </div>
            <div class="menu">☰</div>

            
        </nav>
        <section class="content">
                <h1>Welcome to my portfolio</h1>
                        <div class="content">
                <img src="photo.jpg" alt="My photo">
                <p>I am Learning Web Development.</p>
        </section>

        </div>
        <div class="card">
            <h2>HTML</h2>
            <p>I learned HTML basics and created web pages.</p>
            <button>View Projects</button>


        </div>
        <div class="card">
            <h2>CSS</h2>
            <p>I learned CSS styling and responsive design.</p>
            <button>View Projects</button>
        </div>
        <div class="card">
            <h2>Javascript</h2>
            <p>Iam learning Javascript for interactive websites.</p>
            <button>view Projects</button>
            
        </div>
    </body>
</html>
