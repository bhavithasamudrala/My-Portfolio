<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background-color: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        label {
            color: #cbd5e1;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button type="submit">Login</button>

        </form>

    </div>

</body>

</html>
